# ═════════════════════════════════════════════════════════════════════════════
# PIPELINE TIER — ingestion → parsing → validation → processing → serving backend.
#
# This tier is DISPOSABLE and replaceable. It owns no database and no durable
# data: the only volume is `shared_data`, a local scratch space holding the
# in-flight raw/parsed slices. Everything persistent lives in the stores tier
# (docker-compose.stores.yml), which this file merely connects to.
#
# Bring the stores up FIRST (they create `pipeline_network`), then this:
#
#     docker compose -f docker-compose.stores.yml up -d     # once, long-lived
#     docker compose up -d                                  # the pipeline
#
# If this machine dies, a replacement just runs `docker compose up -d` again with
# its own fresh `shared_data`: it re-polls the latest GDELT slice at startup and
# reconnects to the SAME ClickHouse / Mongo / PostgreSQL. Nothing is re-created and
# no data is deleted.
# ═════════════════════════════════════════════════════════════════════════════
services:

  # Layer 1: Data ingestion — polls GDELT every 15 min (first poll at startup).
  ingestion:
    build:
      context: ./1-ingestion
      dockerfile: Dockerfile
    container_name: pipeline_ingestion
    restart: unless-stopped
    volumes:
      - shared_data:/data
    networks:
      - pipeline_network

  # Layer 2: Parsing
  parsing:
    build:
      context: ./2-parsing
      dockerfile: Dockerfile
    container_name: pipeline_parsing
    restart: unless-stopped
    depends_on:
      - ingestion
    volumes:
      - shared_data:/data
    networks:
      - pipeline_network

  # Layer 3: Validation + storage owner (creates/owns the ClickHouse schema).
  # It retries until ClickHouse is reachable, so no depends_on is needed for a
  # store that lives in the other tier.
  validation:
    build:
      context: ./3-validation_and_storage
      dockerfile: Dockerfile
    container_name: pipeline_validation
    restart: unless-stopped
    depends_on:
      - parsing
    environment:
      # Store addresses default to the stores tier's docker service names (same
      # machine); export the variable before `docker compose up` to point at real
      # off-host addresses, e.g. CLICKHOUSE_HOST=clickhouse.example.com.
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-s1r1}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_CLUSTER: gnews_cluster
      CLICKHOUSE_OP_TIMEOUT: "120"   # caps every ClickHouse op (lookup/insert/OPTIMIZE)
      # How many replicas must acknowledge an append. 2 suits the six-node
      # cluster; .env.testing sets 1, because a single replica can never satisfy
      # a quorum of 2 and every insert would fail with error 285.
      CLICKHOUSE_INSERT_QUORUM: ${CLICKHOUSE_INSERT_QUORUM:-2}
      LATEST_FILES_DIR: /data/latest_files
      STATUS_DIR: /data/status
      MENTION_ENRICH_WORKERS: "8"
      MENTION_ENRICH_NLP: "1"
      ENRICH_TIMEOUT_SECONDS: "600"
    volumes:
      - shared_data:/data
    networks:
      - pipeline_network

  # Layer 4: Processing — pure reader of the silver store; writes the PostgreSQL gold
  # and publishes the territory table to Mongo on startup.
  processing:
    build:
      context: ./4-processing
      dockerfile: Dockerfile
    # Tagged so docker-compose.spark.yml's one-shot submitter can build FROM it
    # rather than duplicating the Spark base, the jars and the code.
    image: radar-processing:latest
    container_name: pipeline_processing
    restart: unless-stopped
    depends_on:
      - validation
    environment:
      # Every store address is env-overridable: same defaults for a same-machine
      # stack, but export MONGO_URI / CLICKHOUSE_HOST / POSTGRES_DSN (etc.) before
      # `docker compose up` to point this pipeline at stores on other machines.
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-s1r1}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      STATUS_DIR: /data/status
      # How many watermark-triggered recomputes pass before one runs FULL rather
      # than incremental. Passed explicitly for the same reason as the SPARK_*
      # settings below: left unset, main.py's own default silently applies and
      # this file appears to have no say. 2880 slices is ~30 days at the 15-min
      # cadence, so a full rebuild is roughly monthly.
      #
      # It is the convergence bound for DELETIONS only, and only backend ones:
      # incremental runs add but never remove, so unreferenced `articles` rows
      # wait for the next full run. Nothing user-visible waits on it — a card
      # that stops matching is removed at once by the change-stream
      # recompute_user(), and retention deletes its own gold rows directly.
      # Lower it (e.g. 12, ~3h) to reclaim that storage sooner; measured cost of
      # a full run is ~8 min warm, ~16 min on a cold Spark session.
      GOLD_FULL_EVERY: ${GOLD_FULL_EVERY:-2880}
      # MongoDB replica set holding the per-user profiles (territories/keywords).
      MONGO_URI: ${MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-radar}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-users}
      # PostgreSQL = the gold sink that serving reads.
      # One DSN instead of host/port/service: in intended mode it lists all
      # three PostgreSQL members with target_session_attrs=read-write, so libpq
      # finds whichever node Patroni has made leader and a failover needs no
      # configuration change here.
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://radar:radar@pipeline_postgres:5432/radar}
      # WHERE the silver -> gold Spark job runs. `local[*]` keeps it inside this
      # container, which is what single-machine mode wants: one code path, no cluster.
      # .env.intended overrides it to spark://spark-master:7077.
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      # How the silver -> gold job is parallelised. All four are read by
      # spark_gold.py and must be passed in explicitly, or the code defaults
      # silently apply and the env file appears to do nothing.
      #   READ    concurrent JDBC range queries against ClickHouse
      #   SHUFFLE partitions each shuffle produces (join, dropDuplicates, ...)
      #   WRITE   concurrent JDBC writers into PostgreSQL
      SPARK_READ_PARTITIONS: ${SPARK_READ_PARTITIONS:-8}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-16}
      SPARK_WRITE_PARTITIONS: ${SPARK_WRITE_PARTITIONS:-4}
      # The HTTP port, for the Spark job's JDBC reads. Distinct from
      # CLICKHOUSE_PORT above, which is the native port the driver-based code
      # uses; JDBC against 9000 fails with "Connection reset".
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
    volumes:
      - shared_data:/data
    networks:
      - pipeline_network

  # Layer 5 (operator side): serving BACKEND — a stateless reader of the stores
  # (Mongo profiles + reference, PostgreSQL gold). It mounts NO volume at all, so it
  # can run on any machine / be replicated behind a load balancer. The FRONTEND is
  # the only piece that runs on each user's machine — see
  # 5-serving/docker-compose.serving.yml.
  backend:
    build:
      context: ./5-serving/backend
      dockerfile: Dockerfile
    container_name: radar-backend
    restart: unless-stopped
    environment:
      # Same override policy as processing (see comment above): defaults target
      # the stores tier on the same machine; export the variables to point at
      # real off-host addresses.
      USE_MOCK: "false"
      MONGO_URI: ${MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-radar}
      MONGO_TIMEOUT: "5"
      # One DSN instead of host/port/service: in intended mode it lists all
      # three PostgreSQL members with target_session_attrs=read-write, so libpq
      # finds whichever node Patroni has made leader and a failover needs no
      # configuration change here.
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://radar:radar@pipeline_postgres:5432/radar}
      POSTGRES_TIMEOUT: "10"
      POSTGRES_RETRIES: "3"
    ports:
      - "8000:8000"
    networks:
      - pipeline_network
  
  # One-shot database seeder — seeds test accounts automatically on fresh installs
  seeder:
    build:
      context: ./5-serving/backend
      dockerfile: Dockerfile
    container_name: pipeline_seeder
    restart: "no"
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./5-serving/seed_test_users.py:/app/seed_test_users.py
    command: python /app/seed_test_users.py
    networks:
      - pipeline_network

volumes:
  # Disposable scratch for the in-flight slices. Local to whichever machine runs
  # the pipeline; never shared, never replicated, safe to lose.
  shared_data:

networks:
  # PIPELINE_NET_EXTERNAL decides whether this tier JOINS an existing
  # `pipeline_network` or CREATES one.
  #
  #   true  (default, .env.testing and .env.intended) — the network already
  #         exists and the pipeline attaches to it. In single-machine mode the stores
  #         compose project created it as a local bridge; in intended mode it is
  #         the attachable OVERLAY created once by hand
  #         (`docker network create -d overlay --attachable pipeline_network`),
  #         which is what lets service names resolve across machines.
  #   false — nothing has created it and Compose must. Setting the variable to
  #         false makes the `external` key vanish entirely, which is what Compose
  #         needs; an override file could not achieve this, because Compose
  #         MERGES files and can add or change a key but never remove one.
  pipeline_network:
    external: ${PIPELINE_NET_EXTERNAL:-true}
    name: pipeline_network
