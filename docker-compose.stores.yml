# ═════════════════════════════════════════════════════════════════════════════
# STORES TIER — ClickHouse (silver), MongoDB (profiles + reference), PostgreSQL (gold).
#
# These are LONG-LIVED and completely detached from the pipeline's lifecycle.
# Bring them up ONCE and leave them running:
#
#     docker compose -f docker-compose.stores.yml up -d
#
# They own their data volumes and the `pipeline_network`. The pipeline tier
# (docker-compose.yml) attaches to that network as an EXTERNAL network and simply
# connects to these services — so a pipeline machine can die and be replaced
# without ever re-creating a store or touching its data.
#
# The two one-time setup steps live here (not in the pipeline), and both are
# idempotent, so re-running this file is safe:
#   * mongo-init      -> rs.initiate(rs0), guarded by rs.status()
#   * postgres-init/  -> 01_schema.sql, run once at first DB creation
# ═════════════════════════════════════════════════════════════════════════════
services:

# ── Why every published store port is bound to 127.0.0.1 ─────────────────────
# `- "9000:9000"` binds to 0.0.0.0 — EVERY interface — so the store is reachable
# from any machine on the same network, not just this one. Measured 2026-08-20:
# ClickHouse and MongoDB accepted unauthenticated reads AND writes from outside
# their containers, and PostgreSQL accepted the repo's published radar:radar.
#
# These ports exist only for host-side tooling (a psql session, clickhouse-client,
# Compass). Loopback keeps all of that working and removes the LAN entirely.
# Override per port with e.g. MONGO1_PUBLISH_BIND=0.0.0.0 if you deliberately
# need remote access; the default is the safe one.
#
# INTENDED MODE does not need this: docker-stack.stores.yml publishes NOTHING —
# the stores are reachable only over the overlay network. Its exposure is a
# different problem (an unencrypted overlay), addressed separately.

  # ── Coordination: 3-node ClickHouse Keeper ensemble (quorum) ──────────────
  #
  # ── Why every service here also mounts a tmpfs ───────────────────────────────
  # An image's VOLUME instruction is a standing order: if compose does not mount
  # that path, Docker invents an ANONYMOUS volume for it — a new one per created
  # container, named with 64 hex characters, kept by `docker compose down` (only
  # `down -v` drops it). Those accumulate silently and forever.
  #
  # clickhouse-keeper declares BOTH /var/lib/clickhouse-keeper and
  # /var/lib/clickhouse. Only the first holds anything: keeper_config.xml points
  # log_storage_path and snapshot_storage_path there, and the second is left as
  # an empty skeleton (verified: zero files under it, all 7 state files under the
  # first). A tmpfs satisfies the VOLUME instruction so no anonymous volume is
  # created, and nothing is lost because there is nothing there to lose.
  #
  # The same reasoning covers mongo's /data/configdb below. The rule for this
  # file: if an image declares a VOLUME, this file must mount SOMETHING at it —
  # a named volume when the data matters, a tmpfs when it does not.
  clickhouse-keeper-1:
    image: clickhouse/clickhouse-keeper:24.3
    container_name: pipeline_ch_keeper_1
    restart: unless-stopped
    volumes:
      - ./clickhouse/${CH_KEEPER1_CONFIG:-keeper-1.local.xml}:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_1_data:/var/lib/clickhouse-keeper
    tmpfs:
      - /var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-keeper-2:
    image: clickhouse/clickhouse-keeper:24.3
    container_name: pipeline_ch_keeper_2
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - ./clickhouse/keeper-2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_2_data:/var/lib/clickhouse-keeper
    tmpfs:
      - /var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-keeper-3:
    image: clickhouse/clickhouse-keeper:24.3
    container_name: pipeline_ch_keeper_3
    profiles: ["full"]
    restart: unless-stopped
    volumes:
      - ./clickhouse/keeper-3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_3_data:/var/lib/clickhouse-keeper
    tmpfs:
      - /var/lib/clickhouse
    networks: [pipeline_network]

  # ── Silver store: 2 shards × 3 replicas (6 ClickHouse nodes) ──────────────
  clickhouse-s1r1:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s1r1
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s1r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s1r1_data:/var/lib/clickhouse
    # Published so a pipeline on ANOTHER machine can reach the cluster via this
    # entry node (set CLICKHOUSE_HOST=<this-host> on the pipeline). Same-host use
    # ignores it and resolves `clickhouse-s1r1` over the Docker network instead.
    ports:
      - "${CLICKHOUSE_PUBLISH_BIND:-127.0.0.1}:${CLICKHOUSE_PUBLISH:-9000}:9000"
    networks: [pipeline_network]

  clickhouse-s1r2:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s1r2
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s1r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s1r2_data:/var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-s1r3:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s1r3
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s1r3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s1r3_data:/var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-s2r1:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s2r1
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s2r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s2r1_data:/var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-s2r2:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s2r2
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s2r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s2r2_data:/var/lib/clickhouse
    networks: [pipeline_network]

  clickhouse-s2r3:
    image: clickhouse/clickhouse-server:24.3
    container_name: pipeline_clickhouse_s2r3
    profiles: ["full"]
    restart: unless-stopped
    depends_on: [clickhouse-keeper-1]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/${CH_CLUSTER_CONFIG:-cluster.local.xml}:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/${CH_MEMORY_CONFIG:-memory.local.xml}:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/macros-s2r3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/zz-network-access.xml:ro
      - ch_s2r3_data:/var/lib/clickhouse
    networks: [pipeline_network]

  # ── MongoDB: 3-node replica set (user profiles + territory reference) ──────
  # Each node publishes a DISTINCT host port so a pipeline on another machine can
  # reach all three (a replica set client must reach every member). Same-host use
  # ignores these and resolves mongo1/2/3 over the Docker network.
  mongo1:
    image: mongo:7
    container_name: pipeline_mongo1
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
    # mongo:7 declares /data/configdb as well as /data/db. It holds config-server
    # state, which a plain replica-set member never writes (verified: empty), but
    # the VOLUME instruction stands regardless — see the keeper note above.
    tmpfs:
      - /data/configdb
    ports:
      - "${MONGO1_PUBLISH_BIND:-127.0.0.1}:${MONGO1_PUBLISH:-27017}:27017"
    networks: [pipeline_network]

  mongo2:
    image: mongo:7
    container_name: pipeline_mongo2
    profiles: ["full"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
    tmpfs:
      - /data/configdb
    ports:
      - "${MONGO2_PUBLISH_BIND:-127.0.0.1}:${MONGO2_PUBLISH:-27018}:27017"
    networks: [pipeline_network]

  mongo3:
    image: mongo:7
    container_name: pipeline_mongo3
    profiles: ["full"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db
    tmpfs:
      - /data/configdb
    ports:
      - "${MONGO3_PUBLISH_BIND:-127.0.0.1}:${MONGO3_PUBLISH:-27019}:27017"
    networks: [pipeline_network]

  # One-shot, idempotent replica-set initiation. rs.status() succeeds once the
  # set exists, so re-running this compose file is a no-op.
  #
  # MONGO_MEMBER_0/1/2 are the addresses the replica set ADVERTISES to clients —
  # they must be reachable from wherever the pipeline runs. Defaults are the
  # Docker service names (same-host). For a SEPARATE stores host, set them in a
  # `.env` to that host's real address + the published ports above, e.g.
  #   MONGO_MEMBER_0=10.0.0.5:27017
  #   MONGO_MEMBER_1=10.0.0.5:27018
  #   MONGO_MEMBER_2=10.0.0.5:27019
  # The init container still CONNECTS internally over the Docker network
  # (mongo1:27017); only the advertised member addresses change.
  mongo-init:
    image: mongo:7
    container_name: pipeline_mongo_init
    depends_on: [mongo1]
    restart: "no"
    # This one never runs a server — it only shells out to mongosh — so BOTH of
    # mongo:7's declared volumes are dead weight here. Left unmounted it was the
    # worst offender in the file: two fresh anonymous volumes on every single
    # `up`, because a one-shot container is re-created every time.
    tmpfs:
      - /data/db
      - /data/configdb
    networks: [pipeline_network]
    environment:
      MONGO_MEMBERS: ${MONGO_MEMBERS:-1}
      MONGO_MEMBER_0: ${MONGO_MEMBER_0:-mongo1:27017}
      MONGO_MEMBER_1: ${MONGO_MEMBER_1:-mongo2:27017}
      MONGO_MEMBER_2: ${MONGO_MEMBER_2:-mongo3:27017}
    entrypoint:
      - bash
      - -c
      - |
        until mongosh --host mongo1:27017 --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; do
          echo "waiting for mongo1..."; sleep 2;
        done
        if [ "$$MONGO_MEMBERS" = "1" ]; then
          MEMBERS="[{_id:0,host:'$$MONGO_MEMBER_0'}]"
        else
          MEMBERS="[{_id:0,host:'$$MONGO_MEMBER_0'},{_id:1,host:'$$MONGO_MEMBER_1'},{_id:2,host:'$$MONGO_MEMBER_2'}]"
        fi
        mongosh --host mongo1:27017 --quiet --eval "
          var want = $$MONGO_MEMBERS;
          var members = $$MEMBERS;
          try {
            var st = rs.status();
            if (st.members.length != want) {
              // Switching between testing (1 node) and full (3 nodes): a set
              // still configured for 3 members with only 1 running has no
              // majority, so no primary is elected and every write fails.
              // force:true is required precisely because there is no primary.
              print('reconfiguring rs0: ' + st.members.length + ' -> ' + want + ' member(s)');
              var cfg = rs.conf();
              cfg.members = members;
              cfg.version = cfg.version + 1;
              rs.reconfig(cfg, {force: true});
            } else {
              print('replica set already has ' + want + ' member(s) - nothing to do');
            }
          } catch (e) {
            print('initiating replica set rs0 with ' + want + ' member(s)...');
            rs.initiate({_id: 'rs0', members: members});
          }"

  # ── PostgreSQL: the gold sink the serving backend reads ───────────────────
  # A SINGLE node here, which is all single-machine mode needs and mirrors what Oracle
  # provided. Intended mode runs three of these under Patroni instead — see
  # docker-stack.stores.yml — which is the reason the gold layer moved off
  # Oracle at all: Oracle Free supports neither RAC nor Data Guard, so it could
  # never be spread across machines.
  #
  # POSTGRES_USER / POSTGRES_DB create the `radar` role and database; the image
  # then runs ./postgres-init/01_schema.sql ONCE, at first database creation,
  # to add the three gold tables.
  pipeline_postgres:
    image: postgres:16
    container_name: pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PUBLISH_BIND:-127.0.0.1}:${POSTGRES_PUBLISH:-5432}:5432"
    networks: [pipeline_network]

volumes:
  # ── Mode-scoped: ClickHouse and Keeper ──────────────────────────────────────
  # Keeper persists its Raft membership on disk, and the replicated tables'
  # coordination lives inside Keeper. A volume written by a one-node ensemble
  # therefore cannot be reused by a three-node one: Keeper refuses every
  # connection and ClickHouse retries forever, so the symptom is a hang at 0%
  # CPU rather than an error.
  #
  # STORE_VOLUMES (set per mode in the env file) gives each topology its OWN
  # volumes, so the two never collide and neither destroys the other's silver.
  # Switching modes is then purely a matter of compose arguments, with no
  # volume-clearing step. Each mode's silver is filled independently by
  # `./bootstrap/silver_snapshot.sh restore` (~3 s from the committed seed).
  keeper_1_data:
    name: ${STORE_VOLUMES:-radar-testing}_keeper_1_data
  keeper_2_data:
    name: ${STORE_VOLUMES:-radar-testing}_keeper_2_data
  keeper_3_data:
    name: ${STORE_VOLUMES:-radar-testing}_keeper_3_data
  ch_s1r1_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s1r1_data
  ch_s1r2_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s1r2_data
  ch_s1r3_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s1r3_data
  ch_s2r1_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s2r1_data
  ch_s2r2_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s2r2_data
  ch_s2r3_data:
    name: ${STORE_VOLUMES:-radar-testing}_ch_s2r3_data

  # ── Shared between modes, deliberately ──────────────────────────────────────
  # MongoDB records its member count on disk too, but `mongo-init` compares it
  # against MONGO_MEMBERS on every start and issues rs.reconfig(…, {force: true})
  # when they differ, so the same volume serves both topologies. Sharing these is
  # a feature: user profiles and tags survive a mode switch.
  #
  # postgres_data is used by single-machine mode only. Intended mode's PostgreSQL runs
  # under Patroni in the Swarm stack with its own per-node volumes, because a
  # Patroni data directory records the cluster identity and cannot be shared with
  # a standalone server — the same reasoning that gives ClickHouse and Keeper
  # mode-scoped volumes above. Gold is derived from silver in any case, so a
  # mode switch costs one recompute rather than any data.
  mongo1_data:
  mongo2_data:
  mongo3_data:
  postgres_data:

networks:
  # Explicit name (no compose project prefix) so the pipeline tier can attach to
  # it as an external network by this exact name.
  pipeline_network:
    name: pipeline_network
