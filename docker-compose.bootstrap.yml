# ═════════════════════════════════════════════════════════════════════════════
# BOOTSTRAP — load a folder of GDELT ZIPs straight into the silver layer.
#
# Run it once, after the stores are up, to give the dashboard a body of history
# immediately instead of waiting days for the 15-minute pipeline to catch up:
#
#     docker compose -f docker-compose.bootstrap.yml run --rm bootstrap
#
# It reads every *.export.CSV.zip / *.mentions.CSV.zip found under ./data/raw
# (searched recursively), applies the same filters the live pipeline applies, and
# writes silver through the validation layer's own Storage class. It does NOT
# write gold: the processing layer's watermark trigger notices silver has grown
# and builds the gold itself, exactly as it does for live data.
#
# Useful settings:
#   LIMIT_SLICES=200   load only the newest N slices (0 = all)
#   ENRICH=1           also scrape article titles/keywords (hours, not minutes)
#   SOURCE_DIR         change the folder that is scanned (inside the container)
#
# Timings are appended to dev_tool_for_time_gauging/bulk_load_report.csv.
# ═════════════════════════════════════════════════════════════════════════════
services:
  bootstrap:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    container_name: pipeline_bootstrap
    environment:
      SOURCE_DIR: /source
      REPORT_DIR: /report
      ENRICH: ${ENRICH:-0}
      LIMIT_SLICES: ${LIMIT_SLICES:-0}
      BATCH_SLICES: ${BATCH_SLICES:-50}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-s1r1}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_CLUSTER: gnews_cluster
      CLICKHOUSE_INSERT_QUORUM: ${CLICKHOUSE_INSERT_QUORUM:-2}
    volumes:
      - ./data/release:/source:ro                    # the ZIPs to load
      - ./dev_tool_for_time_gauging:/report      # where the timing report lands
    networks:
      - pipeline_network

networks:
  pipeline_network:
    external: true
    name: pipeline_network
