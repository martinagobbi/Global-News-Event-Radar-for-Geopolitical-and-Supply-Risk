# ═════════════════════════════════════════════════════════════════════════════
# BOOTSTRAP — load a folder of GDELT ZIPs straight into the silver layer.
#
# Run it once, after the stores are up, to give the dashboard a body of history
# immediately instead of waiting days for the 15-minute pipeline to catch up:
#
#     docker compose -f docker-compose.bootstrap.yml run --rm bootstrap
#
# It reads every *.export.CSV.zip / *.mentions.CSV.zip found under ./data/release
# (searched recursively), applies the same filters the live pipeline applies, and
# writes silver through the validation layer's own Storage class. It does NOT
# write gold: the processing layer's watermark trigger notices silver has grown
# and builds the gold itself, exactly as it does for live data.
#
# Useful settings:
#   LIMIT_SLICES=200            load only the newest N slices (0 = all)
#   ENRICH=1                    also scrape article titles/keywords (hours, not minutes)
#   SOURCE_DIR                  change the folder that is scanned (inside the container)
#   SPARK_MASTER=local[*]       default; distributes across cores on THIS machine.
#                                See bulk_load.py's module docstring before pointing
#                                this at spark://spark-master:7077 — it will fail
#                                today against the generic spark-worker image.
#   SPARK_BULK_LOAD_PARTITIONS  how many slices run at once (default 4) — the
#                                real parallelism knob for this script; unrelated
#                                to SPARK_WORKERS/SPARK_WORKER_CORES, which govern
#                                the resident silver -> gold job, not this one.
#
# Timings are appended to dev_tool_for_time_gauging/bulk_load_report.csv.
# ═════════════════════════════════════════════════════════════════════════════
services:
  bootstrap:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    container_name: pipeline_bootstrap
    environment:
      SOURCE_DIR: /source
      REPORT_DIR: /report
      ENRICH: ${ENRICH:-0}
      # These three must mirror the validation service in docker-compose.yml, or
      # the loader produces silver that the live pipeline would not have produced.
      # MENTION_ENRICH_NLP is the important one: bulk_load.py defaults it to "0",
      # so leaving it unset means article.nlp() is never called and EVERY mention
      # is stored with an empty article_keywords — silently, because a mention
      # still counts as enriched once it has a title.
      MENTION_ENRICH_NLP: ${MENTION_ENRICH_NLP:-1}
      MENTION_ENRICH_WORKERS: ${MENTION_ENRICH_WORKERS:-8}
      ENRICH_TIMEOUT_SECONDS: ${ENRICH_TIMEOUT_SECONDS:-600}
      LIMIT_SLICES: ${LIMIT_SLICES:-0}
      BATCH_SLICES: ${BATCH_SLICES:-50}
      SPARK_MASTER: ${SPARK_MASTER:-local[*]}
      SPARK_BULK_LOAD_PARTITIONS: ${SPARK_BULK_LOAD_PARTITIONS:-4}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-s1r1}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      CLICKHOUSE_CLUSTER: gnews_cluster
      CLICKHOUSE_INSERT_QUORUM: ${CLICKHOUSE_INSERT_QUORUM:-2}
    volumes:
      # RELEASE_SOURCE is the folder of ZIPs. The default reads them straight from
      # the working tree, which is right on Linux. On macOS, see the note below:
      # set it to a named volume instead, or the loader spends longer listing the
      # files than loading them.
      - ${RELEASE_SOURCE:-./data/release}:/source:ro
      - ./dev_tool_for_time_gauging:/report      # where the timing report lands
    networks:
      - pipeline_network

# ── macOS: copy the archive into a named volume first ────────────────────────
# Docker Desktop's file sharing is extremely slow for per-file metadata, and
# worst of all under ~/Desktop and ~/Documents, which macOS additionally guards.
# Measured on this project, listing the 5,762 ZIPs took:
#
#     0.04 s  from a named Docker volume
#     0.04 s  on the host directly
#     > 25 min  through a bind mount of ./data/release
#
# The loader looked frozen at 0% CPU for the whole of that. One tar stream moves
# the archive inside Docker, after which the load runs at full speed:
#
#     docker volume create gdelt_release
#     COPYFILE_DISABLE=1 tar cf - -C data/release . \
#       | docker run --rm -i -v gdelt_release:/dest alpine tar xf - -C /dest
#     RELEASE_SOURCE=gdelt_release ENRICH=1 \
#       docker compose -f docker-compose.bootstrap.yml run --rm bootstrap
#
# COPYFILE_DISABLE=1 stops macOS tar writing an AppleDouble "._name" companion
# beside every file. The loader ignores dot-files, so they are harmless, but they
# double the file count for no reason.
networks:
  pipeline_network:
    external: true
    name: pipeline_network

volumes:
  # Declared so RELEASE_SOURCE=gdelt_release resolves to a named volume rather
  # than being treated as a relative path. Created by the command above; unused
  # when the default bind mount is in effect.
  gdelt_release:
    external: true
