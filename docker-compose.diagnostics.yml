# ═════════════════════════════════════════════════════════════════════════════
# FILTER DIAGNOSTICS — explain why each gold article reached a user's pool.
#
#     docker compose -f docker-compose.diagnostics.yml run --rm diagnostics
#
# Reads Oracle, ClickHouse and MongoDB read-only and writes a single file,
# dev_tools_for_filter_diagnostics/gold_provenance.csv. It changes no store, so
# it is safe to run at any time, including while the pipeline is running.
#
# The store addresses default to the Docker service names, because this joins
# `pipeline_network` like the rest of the pipeline tier.
# ═════════════════════════════════════════════════════════════════════════════
services:
  diagnostics:
    build:
      context: .
      dockerfile: dev_tools_for_filter_diagnostics/Dockerfile
    container_name: pipeline_diagnostics
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse-s1r1}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-9000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
      MONGO_DB: ${MONGO_DB:-radar}
      ORACLE_HOST: ${ORACLE_HOST:-pipeline_oracle}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-radar}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-radar}
    volumes:
      # The CSV lands on the host, next to the script that produced it.
      - ./dev_tools_for_filter_diagnostics:/app/dev_tools_for_filter_diagnostics
    networks:
      - pipeline_network

networks:
  pipeline_network:
    external: true
    name: pipeline_network
