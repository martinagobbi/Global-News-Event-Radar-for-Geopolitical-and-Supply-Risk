# ─────────────────────────────────────────────────────────────────────────────
# Serving FRONTEND — runs on each user's machine, separate from the operator
# stack (ingestion -> parsing -> validation -> processing -> backend, brought up
# by the root docker-compose.yml). It reaches the operator's backend over HTTP
# via BACKEND_URL:
#
#   Normal (multi-machine):  BACKEND_URL=http://<operator-host>:8000
#   Local all-in-one:        BACKEND_URL=http://host.docker.internal:8000
#                            (Linux resolves it via the extra_hosts mapping below)
#
# Start it with:
#   BACKEND_URL=http://<host>:8000 docker compose -f 5-serving/docker-compose.serving.yml up
# ─────────────────────────────────────────────────────────────────────────────
services:
  frontend:
    build: ./frontend
    container_name: radar-frontend
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"
